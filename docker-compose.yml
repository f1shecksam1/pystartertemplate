version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pystartertemplate-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Kod mount (dev için)
      - ./src:/app/src
      # Log’lar host’ta kalsın
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
